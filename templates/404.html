{% extends "base.html" %}

{% block title %}404 - Movie Not Found - CineMatch AI{% endblock %}

{% block content %}
<div class="search-page-container">
  <div class="empty-state" style="margin: 80px auto; max-width: 600px;">
    <div class="empty-icon">🎬</div>
    <h2>Movie Not Found</h2>
    <p>{{ message or "We couldn't locate the requested movie in our 9,700+ title MovieLens catalog." }}</p>
    <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center;">
      <a href="{{ url_for('index') }}" class="btn-primary">Return Home</a>
      <a href="{{ url_for('search_page') }}?q=&genre=All" class="btn-outline">Browse Catalog</a>
    </div>
  </div>
</div>
{% endblock %}
